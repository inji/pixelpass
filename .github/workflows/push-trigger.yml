name: Publish to npm registry
on:
  release:
    types: [ published ]
  pull_request:
    types: [ opened, reopened, synchronize ]
  workflow_dispatch:
    inputs:
      message:
        description: 'Message for manually triggering'
        required: false
        default: 'Triggered for Updates'
        type: string
  push:
    branches:
      - release*
      - master
      - develop*
jobs:
  publish-pixelpass-to-npm-registry:
    if: "${{ !contains(github.ref, 'master') && github.event_name != 'pull_request' && github.event_name == 'workflow_dispatch' }}"
    permissions:
      contents: write
    uses: mosip/kattu/.github/workflows/npm-publish-to-npm-registry.yml@v0.0.1
    with:
      SERVICE_LOCATION: './js'
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # sonar_analysis:
  #   needs: build-kotlin
  #   if: "${{  github.event_name != 'pull_request' }}"
  #   uses: Mahesh-Binayak/kattu/.github/workflows/gradlew-sonar-analysis.yml@sonartest
  #   with:
  #     SERVICE_LOCATION: kotlin/PixelPass
  #   secrets:
  #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #     ORG_KEY: ${{ secrets.ORG_KEY }}  # Changed from SONAR_ORGANIZATION to ORG_KEY
  #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}

  build-kotlin:
    uses: mosip/kattu/.github/workflows/gradle-build.yml@v0.0.1
    with:
      SERVICE_LOCATION: kotlin
      JAVA_VERSION: 21
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_INJI_TEAM }}
